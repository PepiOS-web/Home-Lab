global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090

  - job_name: homelab
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: sensor-prototipo
    scrape_interval: 5s
    static_configs:
      - targets:
          - <SENSOR_IP>:80
