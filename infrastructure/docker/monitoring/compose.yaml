services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    network_mode: host
    pid: host
    restart: unless-stopped
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      - --collector.textfile.directory=/textfile
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/textfile:ro
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.13.3
    container_name: prometheus
    network_mode: host
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /srv/data/appdata/prometheus:/prometheus
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:13.2.1
    container_name: grafana
    network_mode: host
    restart: unless-stopped
    environment:
      GF_SERVER_HTTP_ADDR: ${GRAFANA_BIND_ADDRESS:?Define GRAFANA_BIND_ADDRESS in .env}
      GF_SERVER_HTTP_PORT: "3000"
    volumes:
      - /srv/data/appdata/grafana:/var/lib/grafana
    security_opt:
      - no-new-privileges:true
