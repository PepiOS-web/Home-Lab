# Shared sidecar definition; not used by the ordinary production Compose.
services:
  camera-browser:
    build:
      context: .
      dockerfile: Dockerfile.camera-browser
    image: astrolearner-iss-camera-browser:local
    init: true
    restart: "no"
    environment:
      ISS_BROWSER_CAPTURE_AUTHORIZED: ${ISS_BROWSER_CAPTURE_AUTHORIZED:-false}
      ISS_BROWSER_VIDEO_ID: ${ISS_BROWSER_VIDEO_ID:-awQzjn72bI0}
      ISS_BROWSER_WIDTH: "1280"
      ISS_BROWSER_HEIGHT: "720"
      ISS_BROWSER_FPS: ${ISS_BROWSER_FPS:-12}
      ISS_BROWSER_MAP_OVERLAY: ${ISS_BROWSER_MAP_OVERLAY:-none}
    expose:
      - "8093"
    cpus: 2.0
    mem_limit: 1536m
    pids_limit: 256
    shm_size: 256m
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /home/pwuser:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp:./camera-browser-seccomp.json
    healthcheck:
      # Liveness, not camera readiness: outages must not stop the fallback.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
