services:
  homepage:
    image: ghcr.io/gethomepage/homepage:v2.3.0
    container_name: homepage
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:3000"
    environment:
      HOMEPAGE_ALLOWED_HOSTS: portal.home.arpa
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - /srv/data/appdata/homepage:/app/config
      - /srv/data/appdata/homelab-status/status.json:/app/public/homelab-status.json:ro
    security_opt:
      - no-new-privileges:true
