title: HomeLab Guardian
description: Portal privado de administracion y monitorizacion
language: es
target: _blank
theme: dark
color: slate
headerStyle: boxedWidgets
statusStyle: dot
disableIndexing: true
hideVersion: true
disableUpdateCheck: true
fullWidth: true
useEqualHeights: true
cardBlur: sm

layout:
  Panel operativo:
    style: row
    columns: 1
    icon: mdi-view-dashboard
    initiallyCollapsed: true
  Monitorizacion:
    style: row
    columns: 3
    icon: mdi-chart-line
  Red y seguridad:
    style: row
    columns: 2
    icon: mdi-shield-lock
  Sensores ambientales:
    style: row
    columns: 1
    icon: mdi-home-thermometer
  IA local:
    style: row
    columns: 1
    icon: mdi-creation
  Proyecto:
    style: row
    columns: 1
    icon: mdi-github
    initiallyCollapsed: true
