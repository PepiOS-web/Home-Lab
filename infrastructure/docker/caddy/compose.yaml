services:
  caddy:
    image: caddy:2.11.4-alpine
    container_name: caddy
    network_mode: host
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      SERVER_BIND_ADDRESS: ${SERVER_BIND_ADDRESS:?Define SERVER_BIND_ADDRESS in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/data/appdata/caddy/data:/data
      - /srv/data/appdata/caddy/config:/config
