esphome:
  name: sensor-prototipo
  friendly_name: Sensor prototipo

esp8266:
  board: d1_mini

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80

prometheus:

sensor:
  - platform: dht
    pin: D4
    model: DHT11
    temperature:
      id: temperatura_prototipo
      name: "Temperatura prototipo"
    humidity:
      id: humedad_prototipo
      name: "Humedad prototipo"
    update_interval: 5s
